name: iOS 27 compatibility
on:
  workflow_dispatch:
  pull_request:
    paths: ['App/**', 'AppUITests/**', 'Sources/**', 'Tests/**', 'Fixtures/**', 'Config/**', 'CardioLog.xcodeproj/**', 'Package.*', 'scripts/**', '!scripts/serve-preview.sh', '!scripts/prepare-review.py', '.github/workflows/ios-27.yml']
  push:
    branches: [main]
    paths: ['App/**', 'AppUITests/**', 'Sources/**', 'Tests/**', 'Fixtures/**', 'Config/**', 'CardioLog.xcodeproj/**', 'Package.*', 'scripts/**', '!scripts/serve-preview.sh', '!scripts/prepare-review.py', '.github/workflows/ios-27.yml']
permissions:
  contents: read
concurrency:
  group: ios27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require Xcode 27 and iOS 27
        run: |
          xcodebuild -version | tee toolchain.txt
          grep -Eq '^Xcode 27([ .]|$)' toolchain.txt || { echo 'Xcode 27 unavailable; NOT verified'; exit 1; }
          xcrun simctl list runtimes
          python3 scripts/select-simulator.py 27
      - run: scripts/validate-native.sh 27
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iOS-27-evidence
          path: |
            artifacts/*.xcresult
            toolchain.txt
